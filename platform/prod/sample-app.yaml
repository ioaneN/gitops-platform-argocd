apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ioaneN/gitops-platform-argocd.git
    targetRevision: master
    path: apps/sample-app
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    name: in-cluster
    namespace: sample-app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
