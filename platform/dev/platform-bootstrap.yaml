apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/ioaneN/gitops-platform-argocd.git
    targetRevision: master
    path: platform/bootstrap/dev
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true