apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ioaneN/gitops-platform-argocd.git
    targetRevision: master
    path: platform/stage
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
